<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript String &amp; Math Functions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>JavaScript String &amp; Math Functions</h1>
    <p>Type your input, click a button, and see the result instantly.</p>
  </header>

  <main class="container">

    <!-- ================= STRING FUNCTIONS ================= -->
    <section class="card" id="string-section">
      <h2>String Functions</h2>

      <div class="field">
        <label for="mainText">Text</label>
        <textarea id="mainText" rows="3">JavaScript is fun. I love JavaScript because JavaScript is powerful.</textarea>
      </div>

      <div class="row">
        <div class="field">
          <label for="wordInput">Word to find / search</label>
          <input type="text" id="wordInput" value="JavaScript">
        </div>
        <div class="field">
          <label for="replaceInput">Replace with</label>
          <input type="text" id="replaceInput" value="Python">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="startIndex">Start index</label>
          <input type="number" id="startIndex" value="0">
        </div>
        <div class="field">
          <label for="endIndex">End index / length</label>
          <input type="number" id="endIndex" value="10">
        </div>
      </div>

      <div class="btn-group">
        <button data-action="length">Length</button>
        <button data-action="firstOccurrence">First Occurrence</button>
        <button data-action="lastOccurrence">Last Occurrence</button>
        <button data-action="search">Search</button>
        <button data-action="slice">slice()</button>
        <button data-action="substring">substring()</button>
        <button data-action="substr">substr()</button>
        <button data-action="replaceFirst">Replace First</button>
        <button data-action="replaceAll">Replace All</button>
        <button data-action="upper">UPPERCASE</button>
        <button data-action="lower">lowercase</button>
      </div>

      <div class="output" id="stringOutput" aria-live="polite">
        <span class="placeholder">String result will appear here.</span>
      </div>
    </section>

    <!-- ================= MATH FUNCTIONS ================= -->
    <section class="card" id="math-section">
      <h2>Math Functions</h2>

      <div class="row">
        <div class="field">
          <label for="numA">Number A (base / value)</label>
          <input type="number" id="numA" value="16" step="any">
        </div>
        <div class="field">
          <label for="numB">Number B (exponent)</label>
          <input type="number" id="numB" value="2" step="any">
        </div>
      </div>

      <div class="field">
        <label for="numList">Numbers for min / max (comma separated)</label>
        <input type="text" id="numList" value="12, 5, 89, 34, 7">
      </div>

      <div class="row">
        <div class="field">
          <label for="randMin">Random min</label>
          <input type="number" id="randMin" value="1">
        </div>
        <div class="field">
          <label for="randMax">Random max</label>
          <input type="number" id="randMax" value="100">
        </div>
      </div>

      <div class="btn-group">
        <button data-action="power">Power (A^B)</button>
        <button data-action="sqrt">Square Root (A)</button>
        <button data-action="round">Round (A)</button>
        <button data-action="ceil">Ceil (A)</button>
        <button data-action="floor">Floor (A)</button>
        <button data-action="abs">Absolute (A)</button>
        <button data-action="sin">Sin (A°)</button>
        <button data-action="cos">Cos (A°)</button>
        <button data-action="min">Minimum</button>
        <button data-action="max">Maximum</button>
        <button data-action="random">Random Number</button>
      </div>

      <div class="output" id="mathOutput" aria-live="polite">
        <span class="placeholder">Math result will appear here.</span>
      </div>
    </section>

  </main>

  <footer class="page-footer">
    <p>Built with HTML, CSS &amp; JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
